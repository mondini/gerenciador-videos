<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TESTE-01 · c20 · cartão do versículo</title>
<!-- Mateus 25:40 (Douay-Rheims). Fundo: amanhecer pêssego, sem colinas. -->
<style>
  :root { --ceu: #F6E3D3; --chao: #F1D3BD; --tinta: #2F2E2C; --pessego: #EBCDB0; --rosa: #E2B7A8; --salvia: #B7CBC4; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ceu); cursor: none; }
  svg { display: block; width: 100vw; height: 100vh; }
  .linha { fill: none; stroke: var(--tinta); stroke-width: var(--traco, 1.5); stroke-linecap: round; stroke-linejoin: round; }
  .texto { fill: var(--tinta); font-family: "Iowan Old Style", "Palatino", "Georgia", serif; text-anchor: middle; }
  .versiculo { font-size: 50px; }
  .credito { font-size: 22px; letter-spacing: .16em; }
  .respira { transform-box: fill-box; transform-origin: center; animation: respira 6s ease-in-out infinite alternate; }
  @keyframes respira { from { transform: scale(.96); opacity: .85; } to { transform: scale(1.04); opacity: 1; } }
</style>
</head>
<body>
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-200" y="-200" width="2320" height="1480">
      <feTurbulence class="turb" type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="2" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- no texto o tremor é menor, para não atrapalhar a leitura -->
    <filter id="boil-texto" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feTurbulence class="turb" type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="2" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#boil)">
    <!-- chão baixo, passando das bordas -->
    <path fill="var(--chao)" d="M -200 948 C 240 932 520 962 860 946 S 1380 930 1640 948 S 1900 960 2120 944 L 2120 1300 L -200 1300 Z"/>
    <path class="linha" d="M -200 934 C 240 918 520 948 860 932 S 1380 916 1640 934 S 1900 946 2120 930"/>

    <!-- cruz pequena: mancha rosa antigo deslocada e um laço na base -->
    <g class="respira">
      <path fill="var(--rosa)" transform="translate(5 6)" d="M 952 182 C 962 178 972 180 974 190 L 976 226 L 1006 226 C 1016 228 1016 242 1006 244 L 976 246 L 978 316 C 976 324 962 326 960 316 L 958 246 L 928 246 C 918 244 918 228 928 226 L 958 226 Z"/>
    </g>
    <path class="linha" d="M 960 316 L 960 238 L 924 238 C 916 238 914 228 922 226 L 960 226 L 960 186 C 960 178 970 178 970 186 L 970 226 L 1000 226 C 1008 226 1008 238 1000 238 L 970 238 L 970 314 C 976 328 990 330 992 320 C 994 312 984 308 980 316 C 976 326 984 338 1000 338 C 1030 338 1060 330 1100 334"/>
    <path class="linha" d="M 960 316 C 950 330 910 336 860 334 C 840 333 826 340 832 348 C 838 354 848 348 844 342"/>

    <!-- divisória entre o versículo e o crédito -->
    <path class="linha" d="M 880 704 C 910 696 930 712 960 704 C 990 696 1010 712 1040 704 M 880 704 c -10 2 -18 -6 -12 -12 c 5 -4 12 0 9 6 M 1040 704 c 10 2 18 -6 12 -12 c -5 -4 -12 0 -9 6"/>
  </g>

  <g filter="url(#boil-texto)">
    <text class="texto versiculo" x="960" y="476">“Amen I say to you, as long as you did it</text>
    <text class="texto versiculo" x="960" y="548">to one of these my least brethren,</text>
    <text class="texto versiculo" x="960" y="620">you did it to me.”</text>
    <text class="texto credito" x="960" y="774">MATTHEW 25:40 · DOUAY-RHEIMS</text>
  </g>
</svg>
<script>
  // line boil: troca o seed do ruído entre 4 valores a cada 125 ms
  const seeds = [2, 9, 17, 31];
  let s = 0;
  setInterval(() => {
    s = (s + 1) % seeds.length;
    document.querySelectorAll('.turb').forEach(t => t.setAttribute('seed', seeds[s]));
  }, 125);
</script>
</body>
</html>
