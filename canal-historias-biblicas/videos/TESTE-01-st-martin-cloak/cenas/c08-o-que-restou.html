<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TESTE-01 · c08 · o que restou</title>
<!-- "…except his weapons, and his soldier's cloak": só a espada e a capa. Fundo: céu azul suave. -->
<style>
  :root { --ceu: #DDE6EA; --chao: #CCD9E0; --tinta: #2F2E2C; --salvia: #B7CBC4; --salvia-claro: #C9D0BD; --pessego: #EBCDB0; --rosa: #E2B7A8; --azul: #BFCAD5; --creme: #F0E2CF; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ceu); cursor: none; }
  svg { display: block; width: 100vw; height: 100vh; }
  .linha { fill: none; stroke: var(--tinta); stroke-width: var(--traco, 1.5); stroke-linecap: round; stroke-linejoin: round; }
  .texto { fill: var(--tinta); font-family: "Iowan Old Style", "Palatino", "Georgia", serif; text-anchor: middle; }
  .grande { font-size: 50px; } .medio { font-size: 40px; } .credito { font-size: 22px; letter-spacing: .16em; }
  .nuvem { animation: deriva 12s ease-in-out infinite alternate; }
  .nuvem.b { animation-duration: 16s; animation-delay: -5s; }
  @keyframes deriva { from { transform: translateX(-36px); } to { transform: translateX(36px); } }
  .respira { transform-box: fill-box; transform-origin: center; animation: respira 6s ease-in-out infinite alternate; }
  @keyframes respira { from { transform: scale(.96); } to { transform: scale(1.04); } }
  .chama { transform-box: fill-box; transform-origin: 50% 100%; animation: chama 2s ease-in-out infinite alternate; }
  @keyframes chama { from { transform: scale(.92, .9); } to { transform: scale(1.05, 1.08); } }
  .gira { transform-box: fill-box; transform-origin: center; animation: gira 48s linear infinite; }
  @keyframes gira { to { transform: rotate(60deg); } }
  .balanca { transform-box: fill-box; transform-origin: 50% 100%; animation: balanca 4s ease-in-out infinite alternate; }
  .balanca.b { animation-duration: 6s; animation-delay: -2s; }
  .balanca-topo { transform-box: fill-box; transform-origin: 50% 0; animation: balanca 4s ease-in-out infinite alternate; }
  @keyframes balanca { from { transform: rotate(-1.8deg); } to { transform: rotate(1.8deg); } }
  .voo { animation: atravessa 32s linear infinite; }
  .asa { transform-box: fill-box; transform-origin: 50% 100%; animation: bate .5s ease-in-out infinite alternate; }
  @keyframes atravessa { from { transform: translateX(-200px); } to { transform: translateX(2200px); } }
  @keyframes bate { from { transform: scaleY(1); } to { transform: scaleY(.35); } }
  .pisca { animation: pisca 3s ease-in-out infinite alternate; }
  @keyframes pisca { from { opacity: .25; } to { opacity: 1; } }
  .vento { animation: vento 6s ease-in-out infinite; }
  @keyframes vento { 0% { transform: translateX(40px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateX(-60px); opacity: 0; } }
  .floco { animation: cai linear infinite; }
  .floco > g { animation: oscila ease-in-out infinite alternate; }
  @keyframes cai { from { transform: translateY(0); } to { transform: translateY(1240px); } }
  @keyframes oscila { from { transform: translateX(-7px); } to { transform: translateX(7px); } }

</style>
</head>
<body>
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-200" y="-200" width="2320" height="1480">
      <feTurbulence class="turb" type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="2" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="boil-texto" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feTurbulence class="turb" type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="2" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="1.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#boil)">
    <!-- chão -->
    <path fill="var(--chao)" d="M -200 794 C 200 778 420 808 700 792 S 1200 776 1460 794 S 1820 808 2120 790 L 2120 1300 L -200 1300 Z"/>
    <path class="linha" d="M -200 780 C 200 764 420 794 700 778 S 1200 762 1460 780 S 1820 794 2120 776"/>
    <g transform="translate(780 772) scale(2)" style="--traco: 0.75"><g><path fill="var(--rosa)" transform="translate(8 6)" d="M -90 0 C -94 -20 -88 -40 -70 -44 C -20 -52 40 -52 80 -44 C 96 -40 100 -20 94 0 C 40 6 -40 6 -90 0 Z"/><path class="linha" d="M -90 0 C -94 -20 -88 -40 -70 -44 C -20 -52 40 -52 80 -44 C 96 -40 100 -20 94 0 C 40 6 -40 6 -90 0 Z M -88 -22 C -40 -30 40 -30 96 -22 M 94 0 c 8 2 14 -6 8 -12 c -4 -3 -9 1 -6 4"/></g></g>
    <g transform="translate(1200 770) scale(1.6)" style="--traco: 0.94"><g><path fill="var(--azul)" d="M -82 0 L 136 -6 C 152 -4 158 2 152 8 L -80 16 Z"/><path fill="var(--pessego)" d="M -134 2 L -94 0 L -92 12 L -132 14 Z"/><path class="linha" d="M -94 -6 L 138 -12 C 150 -10 158 -6 162 -2 C 156 2 150 4 138 6 L -94 8"/><path class="linha" d="M -98 -24 C -102 -12 -102 14 -96 26 C -92 30 -88 28 -90 22 C -94 10 -94 -10 -90 -20 C -88 -26 -94 -28 -98 -24 Z"/><path class="linha" d="M -102 -4 L -138 -3 M -102 6 L -138 7 M -138 -3 C -148 -6 -154 0 -152 6 C -150 14 -140 14 -138 7 M -152 4 c -8 2 -16 -4 -12 -10 c 3 -5 10 -3 10 2"/></g></g>

    <g id="neve"></g>
  </g>
</svg>
<script>
  // line boil: troca o seed do ruído entre 4 valores a cada 125 ms
  const seeds = [2, 9, 17, 31];
  let s = 0;
  setInterval(() => {
    s = (s + 1) % seeds.length;
    document.querySelectorAll('.turb').forEach(t => t.setAttribute('seed', seeds[s]));
  }, 125);
  // neve: cada floco cai de cima a baixo em loop, com atraso negativo para a cena já começar com neve
  function aleatorio(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function nevar(alvo, quantos, seed, durMin, durMax) {
    const r = aleatorio(seed), ns = 'http://www.w3.org/2000/svg';
    for (let i = 0; i < quantos; i++) {
      const dur = durMin + r() * (durMax - durMin);
      const g = document.createElementNS(ns, 'g');
      g.setAttribute('class', 'floco');
      g.style.animationDuration = dur + 's';
      g.style.animationDelay = -(r() * dur) + 's';
      const x = r() * 1920, tam = 2.2 + r() * 2.6;
      const dentro = document.createElementNS(ns, 'g');
      const osc = 3 + r() * 3;
      dentro.style.animationDuration = osc + 's';
      dentro.style.animationDelay = -(r() * osc) + 's';
      dentro.innerHTML = r() < 0.7
        ? `<circle cx="${x + 2}" cy="-78" r="${tam + 1.5}" fill="#FBF4EE"/><circle class="linha" cx="${x}" cy="-80" r="${tam}"/>`
        : `<circle cx="${x + 2}" cy="-78" r="${tam + 2}" fill="#FBF4EE"/><path class="linha" d="M ${x - tam} -80 c 0 -${tam} ${tam * 2} -${tam} ${tam * 2} 0 c 0 ${tam * 1.4} -${tam * 1.6} ${tam * 1.4} -${tam * 1.4} 0"/>`;
      g.appendChild(dentro);
      alvo.appendChild(g);
    }
  }
  nevar(document.getElementById('neve'), 10, 4, 30, 44);
</script>
</body>
</html>
