<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TESTE-01 · c25 · oração</title>
<!-- "Let us pray… Amen": paisagem aberta ao amanhecer, cruz na colina mais distante. Fundo: amanhecer pêssego. -->
<style>
  :root { --ceu: #F6E3D3; --chao: #F1D3BD; --tinta: #2F2E2C; --pessego: #EBCDB0; --rosa: #E2B7A8; --salvia: #B7CBC4; --salvia-claro: #C9D0BD; --creme: #F0E2CF; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ceu); cursor: none; }
  svg { display: block; width: 100vw; height: 100vh; }
  .linha { fill: none; stroke: var(--tinta); stroke-width: var(--traco, 1.5); stroke-linecap: round; stroke-linejoin: round; }
  /* sol respirando e raios girando devagar (12 raios em comprimentos alternados: o giro de 60° fecha o loop) */
  .sol { transform-box: view-box; transform-origin: 1180px 400px; animation: respira 6s ease-in-out infinite alternate; }
  .raios { transform-box: view-box; transform-origin: 1180px 400px; animation: gira 48s linear infinite; }
  @keyframes respira { from { transform: scale(.97); } to { transform: scale(1.04); } }
  @keyframes gira { to { transform: rotate(60deg); } }
  /* juncos balançando a partir da base */
  .junco { transform-box: fill-box; transform-origin: 50% 100%; animation: balanca 4s ease-in-out infinite alternate; }
  .junco.b { animation-duration: 6s; animation-delay: -2s; }
  @keyframes balanca { from { transform: rotate(-2.2deg); } to { transform: rotate(2.2deg); } }
  /* pássaros atravessando e batendo as asas */
  .voo { animation: atravessa 32s linear infinite; }
  .asa { transform-box: fill-box; transform-origin: 50% 100%; animation: bate .5s ease-in-out infinite alternate; }
  @keyframes atravessa { from { transform: translateX(-200px); } to { transform: translateX(2200px); } }
  @keyframes bate { from { transform: scaleY(1); } to { transform: scaleY(.35); } }
</style>
</head>

    <filter id="boil" filterUnits="userSpaceOnUse" x="-200" y="-200" width="2320" height="1480">
      <feTurbulence class="turb" type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="2" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="passaro" d="M -14 0 C -10 -7 -4 -8 0 0 C 4 -8 10 -7 14 0"/>

    <g class="junco b">

      <path class="linha" d="M 1394 1000 C 1400 970 1412 952 1432 944"/>
    </g>
  </g>
</svg>
<script>
  // line boil: troca o seed do ruído entre 4 valores a cada 125 ms
  const seeds = [2, 9, 17, 31];
  let s = 0;
  setInterval(() => {
    s = (s + 1) % seeds.length;
    document.querySelectorAll('.turb').forEach(t => t.setAttribute('seed', seeds[s]));
  }, 125);
</script>
</body>
</html>
