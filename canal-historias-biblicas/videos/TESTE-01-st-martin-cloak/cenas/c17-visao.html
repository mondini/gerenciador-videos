<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TESTE-01 · c17 · a visão</title>
<!-- "He saw Christ… given away": forma tomada pela luz, sem rosto, com a meia capa; anjos como asas.
     Regras em docs/doutrina-e-fontes.md. Fundo: amanhecer pêssego. -->
<style>
  :root { --ceu: #F6E3D3; --chao: #F1D3BD; --tinta: #2F2E2C; --pessego: #EBCDB0; --rosa: #E2B7A8; --azul: #BFCAD5; --creme: #F0E2CF; --salvia: #B7CBC4; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ceu); cursor: none; }
  svg { display: block; width: 100vw; height: 100vh; }
  .linha { fill: none; stroke: var(--tinta); stroke-width: var(--traco, 1.5); stroke-linecap: round; stroke-linejoin: round; }
  /* 12 raios em comprimentos alternados: o giro de 60° fecha o loop */
  .raios { transform-box: view-box; transform-origin: 960px 350px; animation: gira 48s linear infinite; }
  @keyframes gira { to { transform: rotate(60deg); } }
  .luz { transform-box: view-box; transform-origin: 960px 350px; animation: respira 6s ease-in-out infinite alternate; }
  @keyframes respira { from { transform: scale(.98); } to { transform: scale(1.03); } }
  /* asas sobem e descem a partir da junção, fora de fase */
  .asa-d { transform-box: fill-box; transform-origin: 0% 72%; animation: asa-d 4s ease-in-out infinite alternate; }
  .asa-e { transform-box: fill-box; transform-origin: 100% 72%; animation: asa-e 4s ease-in-out infinite alternate; }
  @keyframes asa-d { from { transform: rotate(4deg); } to { transform: rotate(-6deg); } }
  @keyframes asa-e { from { transform: rotate(-4deg); } to { transform: rotate(6deg); } }
</style>
</head>
<body>
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="boil" filterUnits="userSpaceOnUse" x="-200" y="-200" width="2320" height="1480">
      <feTurbulence class="turb" type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="2" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- uma asa direita de plumas (estática; o movimento fica no grupo em volta de cada uso), erguida (a esquerda é o espelho); a borda de trás em lóbulos arredondados -->
    <g id="asa">
      <path fill="var(--creme)" transform="translate(6 6)" d="M 0 0 C 20 -30 60 -60 110 -70 C 130 -74 142 -64 130 -54 C 138 -42 126 -32 112 -32 C 118 -18 104 -8 92 -10 C 96 4 80 12 68 6 C 66 20 50 24 40 16 C 28 10 12 6 0 0 Z"/>
      <path class="linha" d="M 0 0 C 20 -30 60 -60 110 -70 C 130 -74 142 -64 130 -54 C 138 -42 126 -32 112 -32 C 118 -18 104 -8 92 -10 C 96 4 80 12 68 6 C 66 20 50 24 40 16 C 28 10 12 6 0 0 Z"/>
    </g>
  </defs>

  <g filter="url(#boil)">
    <!-- chão -->
    <path fill="var(--chao)" transform="translate(0 12)" d="M -200 872 C 200 856 420 886 700 870 S 1200 854 1460 872 S 1820 886 2120 868 L 2120 1300 L -200 1300 Z"/>
    <path class="linha" d="M -200 860 C 200 844 420 874 700 858 S 1200 842 1460 860 S 1820 874 2120 856"/>

    <!-- grande sol de linha atrás da figura, raios girando devagar -->
    <g class="raios">
      <path class="linha" d="M 960 170 L 960 128 M 1050 194 L 1064 170 M 1116 260 L 1152 239 M 1140 350 L 1162 350 M 1116 440 L 1152 461 M 1050 506 L 1064 530 M 960 530 L 960 572 M 870 506 L 856 530 M 804 440 L 768 461 M 780 350 L 758 350 M 804 260 L 768 239 M 870 194 L 856 170"/>
    </g>
    <g class="luz">
      <circle cx="978" cy="364" r="150" fill="var(--pessego)"/>
      <path class="linha" d="M 812 350 A 148 148 0 1 1 960 498 A 148 148 0 0 1 812 350"/>
    </g>

    <!-- anjos: só asas, em volta -->
    <g transform="translate(600 380) scale(.85)" style="--traco: 1.76">
      <g class="asa-d" style="animation-delay: 0s"><use href="#asa"/></g>
      <g class="asa-e" style="animation-delay: 0s"><use href="#asa" transform="scale(-1 1)"/></g>
      <path class="linha" d="M 0 -2 c -4 -6 4 -10 6 -4 c 2 6 -8 10 -10 2"/>
    </g>
    <g transform="translate(1320 380) scale(.85)" style="--traco: 1.76">
      <g class="asa-d" style="animation-delay: -1.3s"><use href="#asa"/></g>
      <g class="asa-e" style="animation-delay: -1.3s"><use href="#asa" transform="scale(-1 1)"/></g>
      <path class="linha" d="M 0 -2 c -4 -6 4 -10 6 -4 c 2 6 -8 10 -10 2"/>
    </g>
    <g transform="translate(560 640) scale(1)">
      <g class="asa-d" style="animation-delay: -2.6s"><use href="#asa"/></g>
      <g class="asa-e" style="animation-delay: -2.6s"><use href="#asa" transform="scale(-1 1)"/></g>
      <path class="linha" d="M 0 -2 c -4 -6 4 -10 6 -4 c 2 6 -8 10 -10 2"/>
    </g>
    <g transform="translate(1360 640) scale(1)">
      <g class="asa-d" style="animation-delay: -3.4s"><use href="#asa"/></g>
      <g class="asa-e" style="animation-delay: -3.4s"><use href="#asa" transform="scale(-1 1)"/></g>
      <path class="linha" d="M 0 -2 c -4 -6 4 -10 6 -4 c 2 6 -8 10 -10 2"/>
    </g>

    <!-- a figura, toda tomada pela luz: sem rosto e sem traços -->
    <path fill="#FFF8F0" transform="translate(10 8)" d="M 960 290 C 984 290 994 312 994 334 C 994 356 980 372 966 376 C 990 384 1010 388 1016 392 C 1036 400 1046 430 1050 470 C 1056 530 1070 580 1074 610 C 1066 616 1056 612 1052 604 C 1046 570 1042 548 1040 520 C 1048 620 1080 720 1110 800 C 1060 798 1020 820 960 808 C 900 796 860 812 810 800 C 840 720 872 620 880 520 C 878 548 874 570 868 604 C 864 612 854 616 846 610 C 850 580 864 530 870 470 C 874 430 884 400 904 392 C 910 388 930 384 954 376 C 940 372 926 356 926 334 C 926 312 936 290 960 290 Z"/>
    <path class="linha" d="M 954 376 C 940 372 926 356 926 334 C 926 312 936 290 960 290 C 984 290 994 312 994 334 C 994 356 980 372 966 376"/>
    <path class="linha" d="M 954 376 C 930 384 910 388 904 392 C 884 400 874 430 870 470 C 864 530 850 580 846 610 c 2 10 16 10 22 -6 C 874 570 878 548 880 520 C 872 620 840 720 810 800 C 860 812 900 796 960 808 C 1020 820 1060 798 1110 800 C 1080 720 1048 620 1040 520 C 1042 548 1046 570 1052 604 c 6 16 20 16 22 6 C 1070 580 1056 530 1050 470 C 1046 430 1036 400 1016 392 C 1010 388 990 384 966 376"/>

    <!-- a meia capa sobre o ombro: é ela que identifica a cena -->
    <path fill="var(--rosa)" transform="translate(9 7)" d="M 904 392 C 944 398 990 430 1008 474 C 1018 504 1012 540 996 566 C 962 548 920 530 884 528 C 876 476 880 420 904 392 Z"/>
    <path class="linha" d="M 904 392 C 944 398 990 430 1008 474 C 1018 504 1012 540 996 566 C 962 548 920 530 884 528 M 996 566 c 8 8 20 4 18 -6 c -2 -8 -12 -6 -10 0"/>

    <!-- nuvens fofas aos pés -->
    <path fill="#FFF8F0" transform="translate(8 6)" d="M 740 846 C 730 816 766 800 790 816 C 800 790 846 788 858 812 C 874 790 920 792 930 818 C 950 796 996 800 1004 826 C 1024 806 1068 810 1074 836 C 1098 822 1136 836 1130 860 C 1100 878 760 880 740 846 Z"/>
    <path class="linha" d="M 734 842 C 724 812 760 796 784 812 C 794 786 840 784 852 808 C 868 786 914 788 924 814 C 944 792 990 796 998 822 C 1018 802 1062 806 1068 832 C 1092 818 1130 832 1124 856 M 734 842 c -10 4 -18 -4 -14 -12 c 4 -6 12 -2 10 4 M 1124 856 c 8 6 18 0 14 -8 c -3 -5 -10 -2 -8 3"/>
  </g>
</svg>
<script>
  // line boil: troca o seed do ruído entre 4 valores a cada 125 ms
  const seeds = [2, 9, 17, 31];
  let s = 0;
  setInterval(() => {
    s = (s + 1) % seeds.length;
    document.querySelectorAll('.turb').forEach(t => t.setAttribute('seed', seeds[s]));
  }, 125);
</script>
</body>
</html>
