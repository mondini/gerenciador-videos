<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="580 220 760 500">
  <!-- A capa de Martinho partida em duas metades (sem o corte); TESTE-01 c13. Coordenadas da cena 1920×1080 de origem: para reaproveitar, copiar o grupo para dentro da cena e mover com transform. -->
  <style>
    :root { --tinta: #2F2E2C; --salvia: #B7CBC4; --salvia-claro: #C9D0BD; --pessego: #EBCDB0; --rosa: #E2B7A8; --azul: #BFCAD5; --creme: #F0E2CF; }
    .linha { fill: none; stroke: var(--tinta); stroke-width: var(--traco, 1.5); stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <path id="metade-e" d="M 958 300 C 944 296 926 284 914 272 C 880 276 846 290 818 312 C 740 372 680 470 652 610 C 680 632 700 618 724 636 C 748 656 770 640 796 654 C 826 670 850 652 878 664 C 906 676 934 662 958 670 C 950 560 964 420 958 300 Z"/>
    <path id="metade-d" d="M 962 300 C 976 296 994 284 1006 272 C 1040 276 1074 290 1102 312 C 1180 372 1240 470 1268 610 C 1240 632 1220 618 1196 636 C 1172 656 1150 640 1124 654 C 1094 670 1070 652 1042 664 C 1014 676 986 662 962 670 C 970 560 956 420 962 300 Z"/>
  </defs>
    <!-- metade esquerda -->
    <g>
      <g transform="translate(-24 -4) rotate(3 958 300)">
        <use href="#metade-e" fill="var(--rosa)" transform="translate(820 480) scale(.88) translate(-820 -480) translate(20 14)"/>
        <use href="#metade-e" class="linha"/>
        <path class="linha" d="M 652 610 c -12 -2 -22 -14 -14 -24 c 7 -8 19 -2 16 8 c -2 6 -9 7 -12 3"/>
        <path class="linha" d="M 818 312 c -10 -4 -14 -16 -5 -20 c 8 -3 12 8 5 14"/>
        <path class="linha" d="M 924 292 c 0 -6 8 -6 8 0 c 0 8 -13 8 -13 -2 c 0 -11 18 -11 18 2 c 0 9 -5 14 -12 16"/>
      </g>
    </g>

    <!-- metade direita -->
    <g>
      <g transform="translate(24 10) rotate(-3 962 300)">
        <use href="#metade-d" fill="var(--rosa)" transform="translate(1100 480) scale(.88) translate(-1100 -480) translate(20 14)"/>
        <use href="#metade-d" class="linha"/>
        <path class="linha" d="M 1268 610 c 12 -2 22 -14 14 -24 c -7 -8 -19 -2 -16 8 c 2 6 9 7 12 3"/>
      </g>
    </g>
</svg>
