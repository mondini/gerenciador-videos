<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="900 760 200 220">
  <!-- São Martinho a cavalo, de costas, com a capa inteira (rosa antigo); TESTE-01 c03. Coordenadas da cena 1920×1080 de origem: para reaproveitar, copiar o grupo para dentro da cena e mover com transform. -->
  <style>
    :root { --tinta: #2F2E2C; --salvia: #B7CBC4; --salvia-claro: #C9D0BD; --pessego: #EBCDB0; --rosa: #E2B7A8; --azul: #BFCAD5; --creme: #F0E2CF; }
    .linha { fill: none; stroke: var(--tinta); stroke-width: var(--traco, 1.5); stroke-linecap: round; stroke-linejoin: round; }
  </style>
<!-- cavaleiro de costas: Martinho com a capa inteira, cavalo em 3/4 com a cabeça para a esquerda -->
    <g transform="translate(1036 968) scale(.95)" style="--traco: 1.58">
      <path fill="var(--azul)" transform="translate(6 5)" d="M -30 -60 C -50 -66 -54 -110 -26 -120 C -10 -126 10 -126 26 -120 C 54 -110 50 -66 30 -60 C 16 -68 -16 -68 -30 -60 Z"/>
      <path fill="var(--rosa)" transform="translate(7 6)" d="M -18 -168 C -30 -150 -42 -126 -42 -112 C -24 -106 24 -106 42 -112 C 42 -126 30 -150 18 -168 C 8 -173 -8 -173 -18 -168 Z"/>
      <!-- pernas traseiras, garupa e barriga -->
      <path class="linha" d="M -26 -62 C -28 -40 -26 -18 -24 0 c -5 2 -10 0 -8 -4 M 26 -62 C 28 -40 26 -18 24 0 c 5 2 10 0 8 -4"/>
      <path class="linha" d="M -30 -60 C -50 -66 -54 -110 -26 -120 C -10 -126 10 -126 26 -120 C 54 -110 50 -66 30 -60 C 16 -68 -16 -68 -30 -60"/>
      <!-- cauda -->
      <path class="linha" d="M 0 -112 C -6 -100 8 -90 0 -78 C -6 -68 4 -58 -4 -52 c -5 2 -8 -4 -3 -7"/>
      <!-- pescoço e cabeça do cavalo -->
      <path fill="var(--azul)" transform="translate(6 5)" d="M -26 -122 C -46 -146 -64 -166 -84 -176 C -96 -182 -106 -176 -110 -164 C -116 -150 -118 -140 -112 -136 C -106 -132 -98 -138 -94 -146 L -86 -146 C -72 -130 -60 -116 -44 -100 Z"/>
      <path class="linha" d="M -26 -122 C -46 -146 -64 -166 -84 -176 C -96 -182 -106 -176 -110 -164 C -116 -150 -118 -140 -112 -136 C -106 -132 -98 -138 -94 -146 L -86 -146 C -72 -130 -60 -116 -44 -100 M -84 -176 L -80 -190 L -74 -178 M -58 -150 c -6 -4 -4 -12 2 -10"/>
      <path class="linha" d="M -46 -98 C -50 -70 -50 -30 -48 -4 c -5 2 -9 0 -7 -4"/>
      <!-- pernas do cavaleiro -->
      <path class="linha" d="M -40 -112 C -48 -100 -48 -86 -42 -76 c -6 1 -8 5 -3 7 M 40 -112 C 48 -100 48 -86 42 -76 c 6 1 8 5 3 7"/>
      <!-- capa e cabeça -->
      <path class="linha" d="M -18 -168 C -30 -150 -42 -126 -42 -112 C -24 -106 24 -106 42 -112 C 42 -126 30 -150 18 -168 C 8 -173 -8 -173 -18 -168 Z M 42 -112 c 9 2 13 -7 7 -11 c -4 -2 -8 2 -5 5"/>
      <circle class="linha" cx="0" cy="-185" r="13"/>
      <!-- vapor da respiração do cavalo -->
      <g><path class="linha" d="M -120 -138 c -9 -7 -5 -18 4 -16 c 7 2 3 11 -3 9"/></g>
      <g style="animation-delay: -2s"><path class="linha" d="M -124 -132 c -7 -5 -3 -14 4 -12"/></g>
    </g>
</svg>
