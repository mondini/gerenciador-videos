    </g>
    <g>
      <circle cx="1194" cy="412" r="70" fill="var(--pessego)"/>
      <path class="linha" d="M 1118 400 A 62 62 0 1 1 1180 462 C 1150 466 1130 450 1118 428 C 1108 410 1086 410 1084 426 C 1082 440 1100 444 1104 432 C 1108 420 1094 404 1066 410 C 1046 414 1034 428 1020 432"/>
